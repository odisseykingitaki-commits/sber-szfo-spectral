# Source of truth for reproducibility. See INSTALL.md.
# Optional loader: src/utils.py::load_config()

paths:
  root: .                       # relative to repo root
  data_raw: data/raw
  data_intermediate: data/intermediate
  data_processed: data/processed
  figures: figures
  results: results
  features_csv: data/processed/features_szfo_v2_final.csv
  labels_threshold: results/labels_threshold.npy
  labels_louvain: results/labels_louvain.npy

filters:
  N_target: 280                 # expected after mobility ∩ spend filters
  min_months_per_mo: 18
  min_months_2024: 6
  region: SZFO                  # via mobility coverage, not OKTMO roster

plm:
  C_reg: 0.2
  binarize: z_gt_0              # StandardScaler then (X > 0)
  log_transform: log1p          # log_total, mob_logratio parts

cluster:
  method: threshold             # canonical: median U1 = X · v1
  equal_sizes_by_construction: true  # 140/140 at even N, no median ties

dynamics:
  window_size_months: 6
  step_months: 1
  # 24 months (2023-01 .. 2024-12) → 19 windows of length 6
  n_windows_expected: 19

features:
  p: 17
  include_rosstat_income: false
  list:
    - share_health
    - share_marketplace
    - share_food
    - share_grocery
    - share_transport
    - log_total
    - growth_health
    - growth_marketplace
    - growth_food
    - growth_grocery
    - growth_transport
    - cv_health
    - cv_marketplace
    - cv_food
    - cv_grocery
    - cv_transport
    - mob_logratio

notes:
  - "03_parse_urov.py is optional ablation; 04_features builds no-income matrix regardless."
  - "Canonical labels: labels_threshold.npy (not labels_final.npy = legacy Louvain)."
