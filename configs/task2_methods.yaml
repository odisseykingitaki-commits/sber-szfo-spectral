# Task 2 method hyperparameters. Source of truth for jury.
# Keep in sync with src/12_timeseries.py and src/13_changepoints.py.

forecast:
  horizons: [1, 3, 6, 12]
  train_test: "last H months as holdout; rest train (per cluster aggregate)"
  baselines:
    naive: "y_hat = y_{t-1} (last train value repeated / walk as coded)"
    seasonal: "seasonal naive (month lag-12 when available)"
    mean: "train mean"
  prophet:
    package: prophet
    # defaults as in 12_timeseries.predict_prophet
  lgbm:
    n_estimators: 50
    max_depth: 3
    learning_rate: 0.05
    min_child_samples: 3
    reg_alpha: 0.5
    reg_lambda: 0.5
    random_state: 42
  catboost:
    iterations: 50
    depth: 3
    learning_rate: 0.05
    random_seed: 42
  ml_features:
    calendar: [month]
    lags: [1, 2, 3, 6, 12]
    rolling: [ma_3, ma_6]   # shifted (past-only)
    spectral_optional: [PR_plus, frustration, lambda_1, lambda_2]
    trends_optional: google_trends query columns (filtered sum interest > 100)
  dropna_after_lags: true
  # H=12: LGBM/CatBoost often empty after lag_12 — data length limit, not leakage

leakage:
  spectral_mask: "spectral['end_dt'] < row['ds']"
  take: last completed window before ds

spectral_from_task1:
  C_reg: 0.2
  window_size_months: 6
  step_months: 1
  n_windows: 19

changepoints:
  signal: [lambda_1, lambda_2, lambda_3, lambda_4, lambda_5, PR_plus]
  exclude_from_signal: [frustration]   # used in forecast features, NOT in CP signal
  date_definition: "spectral['date'] = end of window"
  n_methods_attempted: 9
  methods:
    - {name: PELT_rbf_pen2, algo: PELT, model: rbf, pen: 2}
    - {name: PELT_l2_pen2, algo: PELT, model: l2, pen: 2}
    - {name: PELT_normal_pen2, algo: PELT, model: normal, pen: 2}
    - {name: Binseg_rbf_3, algo: Binseg, model: rbf, n_bkps: 3}
    - {name: Binseg_l2_3, algo: Binseg, model: l2, n_bkps: 3}
    - {name: BottomUp_rbf_3, algo: BottomUp, model: rbf, n_bkps: 3}
    - {name: Window_rbf_3, algo: Window, model: rbf, width: 5, n_bkps: 3}
    - {name: Dynp_rbf_3, algo: Dynp, model: rbf, n_bkps: 3}
    - {name: CUSUM_ARI, algo: CUSUM, on: ARI_between_adjacent_windows}
  consensus:
    rule: "count(date) / n_methods >= 0.5"
    # Verified (changepoints_consensus.csv):
    dates_consensus:
      - {date: 2024-09-01, count: 7, pct: 77.8}
      - {date: 2023-11-01, count: 5, pct: 55.6}
      - {date: 2024-04-01, count: 5, pct: 55.6}
    best_practical_answer: consensus_ge_50pct
    note: "Do not crown a single ruptures algo as uniquely best."

trends_merge:
  region_avg: true
  apply_to_clusters: both_identically
  alignment: "left merge on ds == period (month start)"

honest_post_leakage:
  no_single_winner: true
  prophet_often_best_urban: true
  lgbm_best_rural_H3: true
  naive_competitive: true
