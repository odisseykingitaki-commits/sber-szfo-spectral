# Task 2 — source of truth for jury / reproducibility.
# Scripts src/12_timeseries.py and src/13_changepoints.py currently hardcode
# matching constants; keep in sync. Loader: src/utils.py::load_config() may
# be extended; until then treat this YAML as the documented canon.

paths:
  root: .
  spend: data/intermediate/spend.parquet
  features: data/processed/features_szfo_v2_final.csv
  labels_threshold: results/labels_threshold.npy
  dynamic_summary: results/dynamic_summary.json
  google_trends: data/processed/google_trends_szfo.csv
  forecast_all_models: results/forecast_all_models.csv
  changepoints_all_methods: results/changepoints_all_methods.csv
  changepoints_consensus: results/changepoints_consensus.csv

data:
  region: SZFO
  spend_category: "Все категории"   # Sber OK — mandatory target aggregate
  rosstat_urov: not_used_in_task2
  cluster_labels:
    0: сельские   # Тип A: share_grocery↑ share_food↓ (PLM U1 median)
    1: городские  # Тип B: share_food↑ share_transport↑

forecast:
  horizons_months: [1, 3, 6, 12]
  target: mean_spend_per_mo_in_cluster   # aggregated "Все категории"
  metric_primary: MAE
  metric_optional: R2                   # missing for H=1 in CSV
  models:
    baselines: [naive, seasonal, mean]
    classical: [prophet]
    ml: [lgbm, catboost]
    ml_with_trends: [lgbm_trends, catboost_trends]
  canonical_metrics_csv: results/forecast_all_models.csv
  ignore_draft_csvs:
    - results/forecast_metrics.csv
    - results/forecast_metrics_with_r2.csv

spectral_features:
  source: results/dynamic_summary.json   # rolling PLM windows on spend
  C_reg: 0.2
  columns_used_in_forecast: [PR_plus, frustration, lambda_1, lambda_2]
  # Changepoint signal is separate (no Frustration) — see task2_methods.yaml

leakage_rule:
  # CRITICAL: spectral window must END strictly before forecast date
  rule: "end_dt < ds"
  bug_was: "start_dt <= ds"             # pre-fix (backup in results/_backup_pre_leakage_fix/)
  note: "Only completed past windows enter features; no same-window / future leakage."

trends:
  source: Google Trends (pytrends), not news APIs
  regions: 11 SZFO subjects
  aggregation: mean interest across regions → one SZFO series
  merge: date join on period == ds to BOTH clusters identically
  limitation: "Same regional average applied to rural and urban aggregates."

notes:
  - "Task 2 is self-contained for jury; Type A/B defined from spend features (PLM→U1→median). Optional detail: TASK1_METHOD_REPORT.md."
  - "Foundation TS: Chronos-bolt-tiny zero-shot run — see docs/TASK2_GAPS.md / forecast_foundation.csv."
  - "News not used; Trends is an external-signal proxy only."
